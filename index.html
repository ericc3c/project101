<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mugen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,600;1,600;1,700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-mugen-title: 'Cormorant Garamond', 'Shippori Mincho', 'Cinzel Decorative', 'Palatino Linotype', 'Book Antiqua', 'Georgia', serif;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1714;
      touch-action: manipulation;
      font-family: 'Shippori Mincho', 'Cormorant Garamond', 'Georgia', serif;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      transform: translateZ(0);
    }
    .mugen-calligraphic-title {
      font-family: var(--font-mugen-title) !important;
      font-style: italic !important;
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
    }
    .mugen-calligraphic-title > * {
      font-style: normal;
      letter-spacing: normal;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000000;
      background: #cfc2a9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 18.5% 52%;
      transform: scale(1.06) translateZ(0);
      pointer-events: none;
    }
    @media (orientation: landscape) {
      #loading-video {
        object-position: center center;
        transform: scale(1.035) translateZ(0);
      }
    }
    #loading-bar-wrap {
      position: absolute;
      left: 50%;
      bottom: max(10%, calc(env(safe-area-inset-bottom) + 24px));
      transform: translateX(-50%);
      width: min(78vw, 360px);
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }
    #brush-bar-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    #top-bar {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      z-index: 999999;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      pointer-events: auto;
      touch-action: none;
    }
    #side-bar {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      z-index: 999999;
      display: flex;
      pointer-events: auto;
      touch-action: none;
    }
    .mini-btn {
      background: rgba(20, 18, 15, 0.86);
      color: #f0e6d2;
      border: 1px solid rgba(240, 230, 210, 0.45);
      border-radius: 6px;
      font: 600 11px/1 monospace;
      padding: 7px 10px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      transform: translateZ(0);
    }
    .mini-btn:active { transform: scale(0.94) translateZ(0); }
    .mini-btn.active { border-color: #e6b86a; color: #e6b86a; }
    body[data-game-state="menu"] #btn-pause-menu { display: none !important; }
    #local-hud {
      position: fixed;
      top: calc(max(8px, env(safe-area-inset-top)) + 34px);
      left: max(8px, env(safe-area-inset-left));
      z-index: 999998;
      font: 10px/1.35 monospace;
      color: #00ff88;
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid #00ff88;
      border-radius: 6px;
      padding: 6px 8px;
      max-width: 88vw;
      max-height: 28vh;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
      pointer-events: auto;
      touch-action: pan-y;
    }
    #mobile-controls {
      position: fixed;
      inset: 0;
      z-index: 99990;
      pointer-events: none;
    }
    body[data-game-state="menu"] #mobile-controls,
    body[data-game-state="menu"] #mobile-controls *,
    body.ctrl-off #mobile-controls,
    body.ctrl-off #mobile-controls * {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    #look-zone {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-zone {
      position: absolute;
      left: max(22px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(25, 22, 18, 0.28) 0%, rgba(20, 17, 14, 0.72) 100%);
      border: 1.5px solid rgba(240, 230, 210, 0.44);
      pointer-events: auto;
      touch-action: none;
      transform: translateZ(0);
    }
    #joystick-zone::after {
      content: '';
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px dashed rgba(240, 230, 210, 0.22);
      pointer-events: none;
    }
    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 50px;
      height: 50px;
      margin-left: -25px;
      margin-top: -25px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(245, 235, 215, 0.94), rgba(185, 168, 140, 0.85));
      border: 2px solid rgba(30, 25, 20, 0.8);
      pointer-events: none;
      will-change: transform;
      transform: translate3d(0px, 0px, 0);
    }
    #joystick-knob.sprinting {
      background: radial-gradient(circle at 35% 35%, #ffe09e, #d48b3b);
      border-color: #fff2d6;
    }
    #joystick-knob.walking {
      background: radial-gradient(circle at 35% 35%, #f4efe4, #b7aa96);
    }
    #action-cluster {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 225px;
      height: 205px;
      pointer-events: none;
    }
    .ctrl-btn {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(32, 27, 22, 0.78) 0%, rgba(18, 15, 12, 0.88) 100%);
      color: #f4ead5;
      border: 1.5px solid rgba(240, 230, 210, 0.52);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      letter-spacing: 0.4px;
      pointer-events: auto;
      touch-action: none;
      transform: translateZ(0);
    }
    .ctrl-btn span.sub {
      font-size: 8px;
      font-weight: 500;
      opacity: 0.78;
      margin-top: 1px;
      pointer-events: none;
    }
    .ctrl-btn.pressed, .ctrl-btn.locked {
      background: rgba(212, 145, 65, 0.9);
      color: #1a1410;
      border-color: #fff2d6;
      transform: scale(0.93) translateZ(0);
    }
    #btn-jump { right: 4px; bottom: 4px; width: 64px; height: 64px; font-size: 12px; }
    #btn-attack { right: 78px; bottom: 8px; width: 64px; height: 64px; font-size: 12px; border-color: rgba(235, 165, 145, 0.72); }
    #btn-sprint { right: 152px; bottom: 10px; width: 54px; height: 54px; font-size: 10px; }
    #btn-ink { right: 6px; bottom: 78px; width: 56px; height: 56px; font-size: 11px; border-color: rgba(205, 220, 245, 0.65); }
    #btn-parry { right: 74px; bottom: 80px; width: 56px; height: 56px; font-size: 10px; border-color: rgba(235, 210, 150, 0.72); }
    #btn-interact { right: 10px; bottom: 144px; width: 46px; height: 46px; font-size: 9px; }
    #btn-gourd { right: 66px; bottom: 144px; width: 46px; height: 46px; font-size: 9px; }
    #loading-screen video { background: #cfc2a9; }
  </style>
  <script>
(function () {
  "use strict";
  var Shell = {
    gfxMode: "auto",
    nativeDpr: window.devicePixelRatio || 1,
    targetMaxDpr: 1,
    currentDpr: 1,
    hudEl: null,
    logs: [],
    totalAssets: 0,
    loadedAssets: 0,
    displayedProgress: 0.04,
    targetProgress: 0.04,
    loadingFinished: false,
    lastAssetTime: performance.now(),
    pendingHeavy: 0,
    lockedEl: null,
    pointerLockShim: false,
    masterVol: 1,
    musicVol: 1,
    audioContexts: [],
    nativeFetch: window.fetch.bind(window),
    gameState: "menu",
    bgmGain: null,
    bgmCtx: null,
    bgmStarted: false
  };
  window.MugenShell = Shell;

  try {
    var saveRaw = localStorage.getItem("sumiro.save.v1") || localStorage.getItem("ink_wanderer.save.v1");
    if (saveRaw) {
      var save = JSON.parse(saveRaw);
      if (save && save.options) {
        if (typeof save.options.master === "number") Shell.masterVol = clamp01(save.options.master);
        if (typeof save.options.music === "number") Shell.musicVol = clamp01(save.options.music);
      }
    }
  } catch (err) {}

  var storedGfx = localStorage.getItem("mugen_gfx_mode");
  Shell.gfxMode = storedGfx === "1.5" || storedGfx === "1.85" || storedGfx === "auto" ? storedGfx : "auto";
  var desiredDpr = Shell.gfxMode === "1.85" ? 1.85 : Shell.gfxMode === "1.5" ? 1.5 : Math.min(1.6, Math.max(1, Shell.nativeDpr));
  Shell.targetMaxDpr = Math.max(1, Math.min(desiredDpr, Shell.nativeDpr));
  Shell.currentDpr = Shell.targetMaxDpr;
  try {
    Object.defineProperty(window, "devicePixelRatio", {
      configurable: true,
      get: function () { return Shell.currentDpr; }
    });
  } catch (err) {}

  function clamp01(n) {
    n = Number(n);
    if (!isFinite(n)) return 0;
    return Math.max(0, Math.min(1, n));
  }

  function updateHud(msg, isErr) {
    Shell.logs.push((isErr ? "[ERR] " : "[OK] ") + msg);
    if (Shell.logs.length > 18) Shell.logs.shift();
    var hud = Shell.hudEl;
    if (!hud) return;
    if (isErr) {
      hud.style.borderColor = "#ff5555";
      hud.style.color = "#ffaaaa";
      hud.style.display = "block";
    }
    if (hud.style.display === "block") hud.textContent = Shell.logs.join("\n");
  }

  var nativeSetTarget = AudioParam.prototype.setTargetAtTime;
  var volumeParams = [];
  AudioParam.prototype.setTargetAtTime = function (value, startTime, timeConstant) {
    if (typeof timeConstant === "number" && Math.abs(timeConstant - 0.04) < 1e-6 && value >= 0 && value <= 1.001) {
      var idx = volumeParams.indexOf(this);
      if (idx === -1) {
        volumeParams.push(this);
        idx = volumeParams.length - 1;
      }
      var linear = clamp01(Math.sqrt(value));
      if (idx === 0) {
        Shell.masterVol = linear;
        if (typeof Shell.applyBgmGain === "function") Shell.applyBgmGain();
      }
      if (idx === 1) {
        Shell.musicVol = linear;
        this.__mugenMusicBus = true;
      }
      if (this.__mugenMusicBus) {
        try { this.cancelScheduledValues(startTime); } catch (err) {}
        try { this.value = 0; } catch (err) {}
        if (typeof Shell.applyBgmGain === "function") Shell.applyBgmGain();
        return nativeSetTarget.call(this, 0, startTime, 0.03);
      }
    }
    return nativeSetTarget.call(this, value, startTime, timeConstant);
  };

  var NativeAudio = window.AudioContext || window.webkitAudioContext;
  if (NativeAudio) {
    var PatchedAudio = function PatchedAudioContext(options) {
      var ctx = new NativeAudio(options);
      Shell.audioContexts.push(ctx);
      queueMicrotask(function () {
        try { startBgm(); } catch (err) {}
      });
      return ctx;
    };
    PatchedAudio.prototype = NativeAudio.prototype;
    window.AudioContext = PatchedAudio;
    if (window.webkitAudioContext) window.webkitAudioContext = PatchedAudio;
  }

  function wantsPointerShim() {
    var ua = navigator.userAgent || "";
    var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    var fine = window.matchMedia && window.matchMedia("(any-pointer: fine)").matches;
    return ios || (coarse && !fine);
  }
  try {
    if (wantsPointerShim()) {
      Object.defineProperty(document, "pointerLockElement", {
        configurable: true,
        get: function () { return Shell.lockedEl; }
      });
      Shell.pointerLockShim = true;
    }
  } catch (err) {
    Shell.pointerLockShim = false;
  }
  var nativeRequestLock = Element.prototype.requestPointerLock;
  Element.prototype.requestPointerLock = function () {
    if (Shell.pointerLockShim) {
      var changed = Shell.lockedEl !== this;
      Shell.lockedEl = this;
      if (changed) document.dispatchEvent(new Event("pointerlockchange"));
      return Promise.resolve();
    }
    var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (coarse || typeof nativeRequestLock !== "function") return Promise.resolve();
    try {
      var ret = nativeRequestLock.apply(this, arguments);
      if (ret && typeof ret.catch === "function") ret.catch(function () {});
      return ret || Promise.resolve();
    } catch (err) {
      return Promise.resolve();
    }
  };
  var nativeExitLock = document.exitPointerLock;
  document.exitPointerLock = function () {
    if (Shell.pointerLockShim) {
      if (Shell.lockedEl) {
        Shell.lockedEl = null;
        document.dispatchEvent(new Event("pointerlockchange"));
      }
      return;
    }
    if (typeof nativeExitLock === "function") {
      try { nativeExitLock.call(document); } catch (err) {}
    }
  };

  try { window.createImageBitmap = undefined; } catch (err) {}

  if (window.CanvasRenderingContext2D) {
    ["fillText", "strokeText"].forEach(function (name) {
      var orig = CanvasRenderingContext2D.prototype[name];
      CanvasRenderingContext2D.prototype[name] = function (text, x, y, maxWidth) {
        if (typeof text === "string" && /\bsumiro\b/i.test(text)) {
          text = text.replace(/\bsumiro\b/gi, "Mugen");
        }
        return orig.call(this, text, x, y, maxWidth);
      };
    });
  }

  function patchGl(gl) {
    if (!gl || gl.__mugenPatched) return gl;
    gl.__mugenPatched = true;
    var ext = gl.getExtension("EXT_texture_filter_anisotropic") || gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic");
    if (!ext) return gl;
    ["texParameterf", "texParameteri"].forEach(function (name) {
      var orig = gl[name].bind(gl);
      gl[name] = function (target, pname, param) {
        if (pname === ext.TEXTURE_MAX_ANISOTROPY_EXT && param > 4) param = 4;
        return orig(target, pname, param);
      };
    });
    return gl;
  }
  var nativeGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    if (type === "webgl" || type === "webgl2" || type === "experimental-webgl") {
      var next = Object.assign({}, attrs);
      if (!next.powerPreference) next.powerPreference = "high-performance";
      return patchGl(nativeGetContext.call(this, type, next));
    }
    return nativeGetContext.call(this, type, attrs);
  };

  var baseDir = new URL("./", window.location.href).href;

  function toLocalUrl(url) {
    if (typeof url !== "string") return url;
    if (!url || url.indexOf("blob:") === 0 || url.indexOf("data:") === 0) return url;
    var u = url;
    var marker = "/sumiro/";
    var at = u.indexOf(marker);
    if (at !== -1) return baseDir + u.slice(at + marker.length);
    if (u.indexOf("/assets/") === 0 || u.indexOf("/bundle/") === 0) return baseDir + u.slice(1);
    if (u.indexOf("../assets/") === 0) return baseDir + u.replace("../assets/", "assets/");
    if (u.indexOf("./assets/") === 0 || u.indexOf("./bundle/") === 0) return baseDir + u.slice(2);
    return u;
  }

  function bumpProgress(done) {
    if (Shell.loadingFinished) return;
    Shell.lastAssetTime = performance.now();
    if (!done) Shell.totalAssets += 1;
    else Shell.loadedAssets += 1;
    var ratio = Math.min(0.96, Shell.loadedAssets / Math.max(Shell.totalAssets, 24));
    if (ratio > Shell.targetProgress) Shell.targetProgress = ratio;
  }

  function pathOnly(url) {
    return String(url || "").split("#")[0].split("?")[0];
  }

  window.fetch = function (input, init) {
    var url = input;
    if (typeof input === "string" || input instanceof URL) url = toLocalUrl(String(input));
    else if (input instanceof Request) url = new Request(toLocalUrl(input.url), input);
    var urlStr = typeof url === "string" ? url : (url && url.url) || "";
    var blob = urlStr.indexOf("blob:") === 0 || urlStr.indexOf("data:") === 0;
    var heavy = /\.(glb|bin)$/i.test(pathOnly(urlStr));
    if (!blob) bumpProgress(false);
    var run = function () {
      return Shell.nativeFetch(url, init).then(function (res) {
        if (!blob) bumpProgress(true);
        if (heavy) Shell.pendingHeavy = Math.max(0, Shell.pendingHeavy - 1);
        if (!res.ok) updateHud("404: " + urlStr.split("/").slice(-2).join("/"), true);
        return res;
      }, function (err) {
        if (!blob) bumpProgress(true);
        if (heavy) Shell.pendingHeavy = Math.max(0, Shell.pendingHeavy - 1);
        throw err;
      });
    };
    if (!heavy) return run();
    Shell.pendingHeavy += 1;
    var next = glbQueue.then(run, run);
    glbQueue = next.then(function () {}, function () {});
    return next;
  };
  var glbQueue = Promise.resolve();

  var nativeOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    var rest = Array.prototype.slice.call(arguments, 2);
    var fixed = typeof url === "string" ? toLocalUrl(url) : url;
    return nativeOpen.apply(this, [method, fixed].concat(rest));
  };

  var imgSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  if (imgSrc && imgSrc.set && imgSrc.get) {
    Object.defineProperty(HTMLImageElement.prototype, "src", {
      configurable: true,
      get: function () { return imgSrc.get.call(this); },
      set: function (val) {
        var fixed = typeof val === "string" ? toLocalUrl(val) : val;
        if (typeof fixed === "string" && fixed.indexOf("data:") !== 0 && fixed.indexOf("blob:") !== 0) {
          bumpProgress(false);
          this.addEventListener("load", function () { bumpProgress(true); }, { once: true });
          this.addEventListener("error", function () { bumpProgress(true); }, { once: true });
        }
        imgSrc.set.call(this, fixed);
      }
    });
  }

  var OrigWorker = window.Worker;
  window.Worker = function Worker(url, options) {
    var fixed = typeof url === "string" ? toLocalUrl(url) : url;
    return new OrigWorker(fixed, options);
  };
  window.Worker.prototype = OrigWorker.prototype;

  window.addEventListener("error", function (e) {
    if (e && e.message) updateHud(e.message, true);
  });
  window.addEventListener("unhandledrejection", function (e) {
    updateHud("Promise: " + (e && e.reason ? (e.reason.message || e.reason) : "reject"), true);
  });

  Shell.logs.push("Base: " + baseDir + " | GFX: " + Shell.gfxMode.toUpperCase() + " (" + Shell.currentDpr + "x)");

  var LOADING_URLS = ["./loading.mp4", "./assets/loading.mp4", "./assets/ui/loading.mp4"];
  var loadingVideoReady = false;
  var loadingVideoFailed = false;
  var loadingVideoURL = null;
  var loadingVideoTask = (async function () {
    for (var i = 0; i < LOADING_URLS.length; i++) {
      try {
        var res = await Shell.nativeFetch(LOADING_URLS[i]);
        if (!res.ok) continue;
        var buf = await res.arrayBuffer();
        if (!buf || !buf.byteLength) continue;
        loadingVideoURL = URL.createObjectURL(new Blob([buf], { type: "video/mp4" }));
        return loadingVideoURL;
      } catch (err) {}
    }
    loadingVideoFailed = true;
    updateHud("loading.mp4 not found", true);
    return null;
  })();

  var BGM_FILES = [
    ["./bgm.mp3", "audio/mpeg"],
    ["./bgm.mp4", "audio/mp4"],
    ["./bgm.m4a", "audio/mp4"],
    ["./bgm.wav", "audio/wav"],
    ["./music.mp3", "audio/mpeg"],
    ["./assets/bgm.mp3", "audio/mpeg"],
    ["./assets/bgm.mp4", "audio/mp4"]
  ];
  var bgmTask = null;

  function bgmLevel() {
    var shaped = Math.pow(clamp01(Shell.masterVol) * clamp01(Shell.musicVol), 1.2);
    var gain = shaped * 0.28;
    return Shell.gameState === "menu" ? gain * 0.8 : gain;
  }

  // Safari throws away later slider moves if a ramp is built from gain.value
  // (that getter is NaN during automation) inside one try/catch. Keep a single
  // gain node and assign the level directly so Music / Volume always stick.
  function applyBgmGain() {
    var target = Math.max(0, Math.min(1, bgmLevel()));
    if (Shell.bgmElement && !Shell.bgmRouted) {
      try { Shell.bgmElement.volume = target; } catch (err) {}
    }
    var ctx = Shell.bgmCtx;
    var src = Shell.bgmSource;
    if (!ctx || !src) return;
    var gain = Shell.bgmGain;
    if (!gain || gain.context !== ctx) {
      gain = ctx.createGain();
      try { gain.gain.value = target; } catch (err) {}
      try { src.disconnect(); } catch (err) {}
      try { src.connect(gain); } catch (err) {}
      try { gain.connect(ctx.destination); } catch (err) {}
      Shell.bgmGain = gain;
      return;
    }
    try { gain.gain.cancelScheduledValues(0); } catch (err) {}
    try { gain.gain.value = target; } catch (err) {}
  }
  Shell.applyBgmGain = applyBgmGain;

  function syncMixFromSave(raw) {
    if (!raw) return;
    try {
      var save = JSON.parse(raw);
      if (!save || !save.options) return;
      var nextMaster = typeof save.options.master === "number" ? clamp01(save.options.master) : Shell.masterVol;
      var nextMusic = typeof save.options.music === "number" ? clamp01(save.options.music) : Shell.musicVol;
      if (Math.abs(nextMaster - Shell.masterVol) < 0.001 && Math.abs(nextMusic - Shell.musicVol) < 0.001) return;
      Shell.masterVol = nextMaster;
      Shell.musicVol = nextMusic;
      applyBgmGain();
    } catch (err) {}
  }

  try {
    var nativeSetItem = localStorage.setItem.bind(localStorage);
    localStorage.setItem = function (key, value) {
      nativeSetItem(key, value);

      try { if (ctx.state === "suspended") await ctx.resume(); } catch (err) {}
      if (Shell.bgmStarted) return;
      for (var i = 0; i < BGM_FILES.length; i++) {

      var my = pendingDy;
      pendingDx = 0;
      pendingDy = 0;
      var rx = mx >= 0 ? Math.floor(mx) : Math.ceil(mx);
      var ry = my >= 0 ? Math.floor(my) : Math.ceil(my);
      pendingDx += mx - rx;
      pendingDy += my - ry;
      if (rx || ry) dispatchLook(rx, ry, lastClientX, lastClientY);
    }

    if (lookZone) {
      lookZone.addEventListener("touchstart", function (e) {
        if (!playingTouch() || lookTouchId !== null) return;
        var t = e.changedTouches[0];
        lookTouchId = t.identifier;
        lastLookX = t.clientX;
        lastLookY = t.clientY;
        pendingDx = 0;
        pendingDy = 0;
      }, { passive: true });
      lookZone.addEventListener("touchmove", function (e) {
        if (!playingTouch()) return;
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          if (t.identifier !== lookTouchId) continue;
          e.preventDefault();
          pendingDx += (t.clientX - lastLookX) * lookSens;
          pendingDy += (t.clientY - lastLookY) * lookSens;
          lastLookX = t.clientX;
          lastLookY = t.clientY;
          lastClientX = t.clientX;
          lastClientY = t.clientY;
          if (!lookQueued) {
            lookQueued = true;
            requestAnimationFrame(flushLook);
          }
          break;
        }
      }, { passive: false });
      function endLook(e) {
        var touches = e.changedTouches || [];
        for (var i = 0; i < touches.length; i++) {
          if (touches[i].identifier === lookTouchId) {
            lookTouchId = null;
            pendingDx = 0;
            pendingDy = 0;
            return;
          }
        }
      }
      lookZone.addEventListener("touchend", endLook);
      lookZone.addEventListener("touchcancel", endLook);

      var lastMouse = null;
      lookZone.addEventListener("click", function () {
        if (Shell.gameState !== "playing") return;
        var canvas = getCanvas();
        if (canvas && canvas.requestPointerLock) canvas.requestPointerLock();
      });
      lookZone.addEventListener("mousemove", function (e) {
        if (Shell.gameState !== "playing") return;
        if (e.movementX || e.movementY) {
          lastMouse = null;
          return;
        }
        if (lastMouse) {
          var dx = e.clientX - lastMouse.x;
          var dy = e.clientY - lastMouse.y;
          if (dx || dy) dispatchLook(dx, dy, e.clientX, e.clientY);
        }
        lastMouse = { x: e.clientX, y: e.clientY };
      });
    }

    function bindHold(id, onDown, onUp) {
      var el = document.getElementById(id);
      if (!el) return;
      var touchId = null;
      el.addEventListener("touchstart", function (e) {
        if (!playingTouch() || touchId !== null) return;
        e.preventDefault();
        e.stopPropagation();
        touchId = e.changedTouches[0].identifier;
        el.classList.add("pressed");
        onDown();
      }, { passive: false });
      function finish(e) {
        var mine = false;
        var touches = e.changedTouches || [];
        for (var i = 0; i < touches.length; i++) {
          if (touches[i].identifier === touchId) mine = true;
        }
        if (!mine && touchId !== null) return;
        touchId = null;
        el.classList.remove("pressed");
        onUp();
      }
      el.addEventListener("touchend", finish, { passive: false });
      el.addEventListener("touchcancel", finish, { passive: false });
    }

    updateSprintUi();
    if (btnSprint) {
      btnSprint.addEventListener("touchstart", function (e) {
        if (!playingTouch()) return;
        e.preventDefault();
        e.stopPropagation();
        gait = gait === "run" ? "sprint" : gait === "sprint" ? "walk" : "run";
        updateSprintUi();
        var moving = activeKeys.has("KeyW") || activeKeys.has("KeyS") || activeKeys.has("KeyA") || activeKeys.has("KeyD");
        applyGait(moving);
      }, { passive: false });
    }

    bindHold("btn-attack", function () {
      setKey("KeyJ", true);
      fireMouseButton(0, true);
    }, function () {
      setKey("KeyJ", false);
      fireMouseButton(0, false);
    });
    bindHold("btn-parry", function () {
      setKey("KeyK", true);
      fireMouseButton(2, true);
    }, function () {
      setKey("KeyK", false);
      fireMouseButton(2, false);
    });
    bindHold("btn-jump", function () { setKey("Space", true); }, function () { setKey("Space", false); });
    bindHold("btn-ink", function () { setKey("KeyQ", true); }, function () { setKey("KeyQ", false); });
    bindHold("btn-interact", function () { setKey("KeyE", true); }, function () { setKey("KeyE", false); });
    bindHold("btn-gourd", function () { setKey("KeyF", true); }, function () { setKey("KeyF", false); });

    window.addEventListener("blur", function () {
      resetJoystick();
      releaseAllKeys();
    });
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        var ctx = Shell.bgmCtx;
        if (ctx && ctx.state === "suspended") ctx.resume().catch(function () {});
        applyBgmGain(0.2);
      }
    });

    if (Shell.audioContexts.length) startBgm();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
  </script>
